<!DOCTYPE html>
<html>
    <head>
        <title>Particle Accelerator</title>
        <link rel="icon" type="image/png" href="https://samsongraceacademy.neocities.org/MYFOLDER_DO_NOT_TOUCH/pixil-frame-0%20(1).png">

        <style>
            .cursorcircle {
                width: 64px;
                height: 64px;
                border-radius: 75%;
                position: absolute;
                pointer-events: none;
                z-index: 9999999999999999999;
                background-color: rgba(0, 0, 0, 0.5);
                cursor: none;
                opacity: 0;
            }
        </style>
    </head>

    <body>
        <div class="cursorcircle" id="CurserCircle"></div>

        <script>
            document.addEventListener('DOMContentLoaded', function(e) {
                var cursorCircle = document.getElementById('CurserCircle');
                cursorCircle.style.left = (e.clientX - 32) + 'px';
                cursorCircle.style.top = (e.clientY - 32) + 'px';
            });

            document.addEventListener('mousemove', function(e) {
                var cursorCircle = document.getElementById('CurserCircle');
                cursorCircle.style.left = (e.clientX - 32) + 'px';
                cursorCircle.style.top = (e.clientY - 32) + 'px';
                cursorCircle.style.opacity = 1;
            });
        </script>
    </body>
</html>
