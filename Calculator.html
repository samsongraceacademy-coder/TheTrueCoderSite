<!DOCTYPE html>
<head>
    <style>
        .NumberOP{
            color: rgba(255, 255, 255, 1);
            background-color: rgb(253, 186, 109);
            border-radius: 4px;
            border-color: rgb(253, 186, 109);
            border-width: 2px;
            border-style: solid;
            text-align: center;
        }

        .MathOP {
            color: rgba(255, 255, 255, 1);
            background-color: rgb(255, 118, 230);
            border-radius: 4px;
            border-color: rgb(255, 118, 230);
            border-width: 2px;
            border-style: solid;
            text-align: center;
        }

        .CalculatorNumbers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            height: 230px;
            max-width: 290px;
            margin: 0 auto;
        }

        .CalculatorOps {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            height: 380px;
            max-width: 80px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <html>
        <aside style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0px;">
            <aside class="CalculatorNumbers">
                <div class="NumberOP">1</div>
                <div class="NumberOP">2</div>
                <div class="NumberOP">3</div>
                <div class="NumberOP">4</div>
                <div class="NumberOP">5</div>
                <div class="NumberOP">6</div>
                <div class="NumberOP">7</div>
                <div class="NumberOP">8</div>
                <div class="NumberOP">9</div>
                <div class="NumberOP">0</div>
            </aside>

            <aside class="CalculatorOps">
                <div class="MathOP">+</div>
                <div class="MathOP">-</div>
                <div class="MathOP">*</div>
                <div class="MathOP">/</div>
                <div class="MathOP">=</div>
            </aside>
        </aside>
    </html>
</body>
