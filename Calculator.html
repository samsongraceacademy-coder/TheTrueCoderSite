<!DOCTYPE html>
<html>
    <head>
        <style>
            .FullCalculator {
                display: grid;
                grid-template-columns: repeat(1, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 10px;
                justify-items: center;
                align-items: center;
                height: 380px;
                width: 310px;
                background-color: rgb(54, 78, 51);
                border-radius: 4px;
                margin: 0px 0px;
                transform: translateX(-50%) translateY(-50%);
                position: absolute;
                top: 50%;
                left: 50%;
            }

            .screen{
                width: 270px;
                height: 60px;
                border-radius: 4px;
                background-color: rgb(123, 123, 123);
                display: grid;
                place-items: center;
            }


            .NumberOP{
                color: rgba(255, 255, 255, 1);
                background-color: rgb(253, 186, 109);
                border-radius: 4px;
                border-color: rgb(253, 186, 109);
                border-width: 2px;
                border-style: solid;
                text-align: center;
                display: grid;
                place-items: center;
            }

            .MathOP {
                color: rgba(255, 255, 255, 1);
                background-color: rgb(255, 118, 230);
                border-radius: 4px;
                border-color: rgb(255, 118, 230);
                border-width: 2px;
                border-style: solid;
                text-align: center;
                display: grid;
                place-items: center;
            }

            .Calculator {
                display: grid;
                grid-template-columns: repeat(4, 60px);
                grid-template-rows: repeat(4, 60px);
                gap: 10px;
                height: 270px;
                max-width: 270px;
                transform: translateY(-10px);
            }
        </style>
    </head>
    <body>
        <div class="FullCalculator">
            <div id="screen" class="screen"></div>

            <div class="Calculator">
                <div id="One" class="NumberOP">1</div>
                <div id="Two" class="NumberOP">2</div>
                <div id="Three" class="NumberOP">3</div>
                <div id="Plus" class="MathOP">+</div>
                <div id="Four" class="NumberOP">4</div>
                <div id="Five" class="NumberOP">5</div>
                <div id="Six" class="NumberOP">6</div>
                <div id="Minus" class="MathOP">-</div>
                <div id="Seven" class="NumberOP">7</div>
                <div id="Eight" class="NumberOP">8</div>
                <div id="Nine" class="NumberOP">9</div>
                <div id="Multiply" class="MathOP">*</div>
                <div id="Clear" class="NumberOP">CE</div>
                <div id="Zero" class="NumberOP">0</div>
                <div id="Equals" class="MathOP">=</div>
                <div id="Divide" class="MathOP">/</div>
            </div>

            <script>
                document.getElementById("One").onclick = function() {
                    document.getElementById("screen").innerHTML = "1";
                }

                document.getElementById("Two").onclick = function() {
                    document.getElementById("screen").innerHTML = "2";
                }

                document.getElementById("Three").onclick = function() {
                    document.getElementById("screen").innerHTML = "3";
                }

                document.getElementById("Four").onclick = function() {
                    document.getElementById("screen").innerHTML = "4";
                }

                document.getElementById("Five").onclick = function() {
                    document.getElementById("screen").innerHTML = "5";
                }

                document.getElementById("Six").onclick = function() {
                    document.getElementById("screen").innerHTML = "6";
                }

                document.getElementById("Seven").onclick = function() {
                    document.getElementById("screen").innerHTML = "7";
                }

                document.getElementById("Eight").onclick = function() {
                    document.getElementById("screen").innerHTML = "8";
                }

                document.getElementById("Nine").onclick = function() {
                    document.getElementById("screen").innerHTML = "9";
                }

                document.getElementById("Zero").onclick = function() {
                    document.getElementById("screen").innerHTML = "0";
                }

                document.getElementById("Clear").onclick = function() {
                    document.getElementById("screen").innerHTML = "";
                }
            </script>
        </div>
    </body>
</html>
