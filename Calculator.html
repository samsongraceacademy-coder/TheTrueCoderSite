<!DOCTYPE html>
<head>
    <style>
        .NumberOP{
            color: rgba(255, 255, 255, 1);
            background-color: rgb(253, 186, 109);
            border-radius: 4px;
            border-color: rgb(253, 186, 109);
            border-width: 2px;
            border-style: solid;
            text-align: center;
        }

        .MathOP {
            color: rgba(255, 255, 255, 1);
            background-color: rgb(255, 118, 230);
            border-radius: 4px;
            border-color: rgb(255, 118, 230);
            border-width: 2px;
            border-style: solid;
            text-align: center;
        }

        .CalculatorNumbers {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(4, 60px);
            gap: 10px;
            height: 270px;
            max-width: 290px;
            margin: 0 auto;
            place-items: center;
        }

        .CalculatorOps {
            display: grid;
            grid-template-columns: repeat(1, 60px);
            grid-template-rows: repeat(5, 60px);
            gap: 10px;
            height: 340px;
            max-width: 80px;
            margin: 0 auto;
            place-items: center;
        }

        .Calculator {
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 10px;
            max-width: 370px;
            position: relative;
        }

        body {
            display: grid;
            place-items: center;
        }
    </style>
</head>
<body>
    <html>
        <aside class="Calculator">
            <aside class="CalculatorNumbers">
                <div class="NumberOP">1</div>
                <div class="NumberOP">2</div>
                <div class="NumberOP">3</div>
                <div class="NumberOP">4</div>
                <div class="NumberOP">5</div>
                <div class="NumberOP">6</div>
                <div class="NumberOP">7</div>
                <div class="NumberOP">8</div>
                <div class="NumberOP">9</div>
                <div class="NumberOP"
                style="position: center;">0</div>
            </aside>

            <aside class="CalculatorOps">
                <div class="MathOP">+</div>
                <div class="MathOP">-</div>
                <div class="MathOP">*</div>
                <div class="MathOP">/</div>
                <div class="MathOP">=</div>
            </aside>
        </aside>
    </html>
</body>
