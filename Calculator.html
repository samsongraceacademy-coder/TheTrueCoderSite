<!DOCTYPE html>
<html>
    <head>
        <style>
            .FullCalculator {
                display: grid;
                grid-template-columns: repeat(1, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 10px;
                justify-items: center;
                align-items: center;
                height: 380px;
                width: 310px;
                background-color: rgb(54, 78, 51);
                border-radius: 4px;
                margin: 0px 0px;
                transform: translateX(-50%) translateY(-50%);
                position: absolute;
                top: 50%;
                left: 50%;
            }

            .screen{
                width: 270px;
                height: 60px;
                border-radius: 4px;
                background-color: rgb(123, 123, 123);
                display: grid;
                place-items: center;
                font-size: 24px;
                overflow-x: auto;
                white-space: nowrap;
            }


            .NumberOP{
                color: rgba(255, 255, 255, 1);
                background-color: rgb(253, 186, 109);
                border-radius: 4px;
                border-color: rgb(253, 186, 109);
                border-width: 2px;
                border-style: solid;
                text-align: center;
                display: grid;
                place-items: center;
                font-size: 24px;
            }

            .MathOP {
                color: rgba(255, 255, 255, 1);
                background-color: rgb(255, 118, 230);
                border-radius: 4px;
                border-color: rgb(255, 118, 230);
                border-width: 2px;
                border-style: solid;
                text-align: center;
                display: grid;
                place-items: center;
                font-size: 24px;
            }

            .Calculator {
                display: grid;
                grid-template-columns: repeat(4, 60px);
                grid-template-rows: repeat(4, 60px);
                gap: 10px;
                height: 270px;
                max-width: 270px;
                transform: translateY(-10px);
                font-size: 24px;
            }
        </style>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.6.4/math.min.js"></script>
    </head>
    <body>
        <div class="FullCalculator">
            <div id="screen" class="screen"></div>

            <div class="Calculator">
                <div id="One" class="NumberOP">1</div>
                <div id="Two" class="NumberOP">2</div>
                <div id="Three" class="NumberOP">3</div>
                <div id="Plus" class="MathOP">+</div>
                <div id="Four" class="NumberOP">4</div>
                <div id="Five" class="NumberOP">5</div>
                <div id="Six" class="NumberOP">6</div>
                <div id="Minus" class="MathOP">-</div>
                <div id="Seven" class="NumberOP">7</div>
                <div id="Eight" class="NumberOP">8</div>
                <div id="Nine" class="NumberOP">9</div>
                <div id="Multiply" class="MathOP">*</div>
                <div id="Clear" class="NumberOP">CE</div>
                <div id="Zero" class="NumberOP">0</div>
                <div id="Equals" class="MathOP">=</div>
                <div id="Divide" class="MathOP">/</div>
            </div>

            <script>
                let $One = $("#One");
                let $Two = $("#Two");
                let $Three = $("#Three");
                let $Four = $("#Four");
                let $Five = $("#Five");
                let $Six = $("#Six");
                let $Seven = $("#Seven");
                let $Eight = $("#Eight");
                let $Nine = $("#Nine");
                let $Zero = $("#Zero");
                let $Clear = $("#Clear");
                let $Plus = $("#Plus");
                let $Minus = $("#Minus");
                let $Multiply = $("#Multiply");
                let $Divide = $("#Divide");
                let $Equals = $("#Equals");
                let $screen = $("#screen");

                $One.click(function() {
                    $screen.append("1");
                });

                $Two.click(function() {
                    $screen.append("2");
                });

                $Three.click(function() {
                    $screen.append("3");
                });

                $Four.click(function() {
                    $screen.append("4");
                });

                $Five.click(function() {
                    $screen.append("5");
                });

                $Six.click(function() {
                    $screen.append("6");
                });

                $Seven.click(function() {
                    $screen.append("7");
                });

                $Eight.click(function() {
                    $screen.append("8");
                });

                $Nine.click(function() {
                    $screen.append("9");
                });

                $Zero.click(function() {
                    $screen.append("0");
                });

                $Clear.click(function() {
                    $screen.empty();
                });

                $Plus.click(function() {
                    if (!$screen.text().endsWith(" ")) {
                    $screen.append(" + ");
                }});

                $Minus.click(function() {
                    if (!$screen.text().endsWith(" ")) {
                    $screen.append(" - ");
                }});

                $Multiply.click(function() {
                    if (!$screen.text().endsWith(" ")) {
                    $screen.append(" * ");
                }});

                $Divide.click(function() {
                    if (!$screen.text().endsWith(" ")) {
                    $screen.append(" / ");
                }});

                $Equals.click(function() {
                    let Answer = math.evaluate($screen.text());
                    $screen.text(Answer);
                });
            </script>
        </div>
    </body>
</html>
